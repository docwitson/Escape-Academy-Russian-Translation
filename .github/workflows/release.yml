name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install -r .\requirements-build.txt

      - name: Validate localization payload
        shell: pwsh
        run: python .\src\installer_app.py --self-test

      - name: Build installer
        shell: pwsh
        run: .\build.ps1

      - name: Test packaged installer
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\EscapeAcademyRussianInstaller.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content -LiteralPath .\dist\EscapeAcademyRussianInstaller.log -Encoding utf8
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed" }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeAcademyRussianInstaller-${{ github.ref_name }}
          path: |
            dist/EscapeAcademyRussianInstaller.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            ".\dist\EscapeAcademyRussianInstaller.exe",
            ".\dist\SHA256SUMS.txt"
          )
          $releases = gh api `
            "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $existing = $releases | Where-Object {
            $_.tag_name -eq $env:GITHUB_REF_NAME
          }
          if ($null -ne $existing) {
            gh release upload "$env:GITHUB_REF_NAME" @assets --clobber
          } else {
            $notes = ".\.github\release-notes\$env:GITHUB_REF_NAME.md"
            if (Test-Path -LiteralPath $notes) {
              gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag `
                --notes-file $notes `
                --title "Русификатор Escape Academy $env:GITHUB_REF_NAME"
            } else {
              gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag `
                --generate-notes `
                --title "Русификатор Escape Academy $env:GITHUB_REF_NAME"
            }
          }
